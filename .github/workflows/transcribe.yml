name: Transcribe audio
on:
  workflow_dispatch:
    inputs:
      dir: {description: "folder with .wav/.mp4 files", required: true}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: (which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)) && pip install -q openai-whisper
      - run: |
          python - <<'PY'
          import whisper, glob, os
          m = whisper.load_model("small")
          for f in sorted(glob.glob(os.path.join("${{ inputs.dir }}", "*"))):
              r = m.transcribe(f, fp16=False, word_timestamps=True)
              print("TRANSCRIPT", os.path.basename(f), r["language"], "|", r["text"].strip())
              for sg in r["segments"]: print("SEG", os.path.basename(f), round(sg["start"],2), round(sg["end"],2), sg["text"].strip())
          PY
