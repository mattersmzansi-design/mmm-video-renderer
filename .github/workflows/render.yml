name: Render video

on:
  workflow_dispatch:
    inputs:
      content:
        description: "Content file to render"
        required: false
        default: "content.json"
      voiceover:
        description: "Generate voiceover"
        type: boolean
        required: false
        default: true
      upload:
        description: "Upload to YouTube as private (needs the YT_ secrets)"
        type: boolean
        required: false
        default: true
      fps:
        description: "Frames per second"
        required: false
        default: "30"
  push:
    paths:
      - "content.json"
      - "content-short.json"
      - "assets/**"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # a push renders the long video and the Short side by side;
        # a manual run renders only the file typed into the form
        content: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.content) || '["content.json","content-short.json"]') }}
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Fetch brand fonts
        run: |
          mkdir -p fonts
          base=https://raw.githubusercontent.com/google/fonts/main
          curl -sSfL "$base/ofl/archivo/Archivo%5Bwdth,wght%5D.ttf" \
            -o fonts/Archivo-Bold.ttf || echo "archivo fetch failed, using fallback"
          curl -sSfL "$base/ofl/ibmplexmono/IBMPlexMono-Regular.ttf" \
            -o fonts/IBMPlexMono-Regular.ttf || echo "plex fetch failed, using fallback"
          ls -la fonts

      - name: Generate voiceover
        if: ${{ github.event_name == 'push' || inputs.voiceover }}
        run: python voice.py --content "${{ matrix.content }}"

      - name: Fetch b-roll footage
        run: python broll.py --content "${{ matrix.content }}"

      - name: Render
        run: |
          FPS="${{ inputs.fps || '30' }}"
          if [ -f build/content.timed.json ]; then
            echo "rendering with voiceover"
            python render.py --content build/content.timed.json \
                             --audio build/voiceover.m4a --fps "$FPS"
          else
            echo "rendering silent"
            python render.py --content "${{ matrix.content }}" --fps "$FPS"
          fi

      - name: Save video
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.content }}
          path: |
            out/*.mp4
            build/voiceover.m4a
            build/broll-sources.json
          retention-days: 30

      - name: Upload to YouTube (private)
        if: ${{ env.YT_REFRESH_TOKEN != '' && (github.event_name == 'push' || inputs.upload) }}
        run: python upload.py --content "${{ matrix.content }}"
